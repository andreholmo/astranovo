name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Least-privilege permissions required by CLAUDE.md acceptance checks.
          claude_args: |
            --allowedTools "Edit,Write,Bash(npm ci:*),Bash(npm run typecheck:*),Bash(npm run build:*),Bash(npm test:*)"

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

      - name: Open pull request for completed issue work
        if: |
          (github.event_name == 'issues' || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null)) &&
          steps.claude.outputs.conclusion == 'success' &&
          steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$CLAUDE_BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "Refusing to open a pull request from the default branch."
            exit 1
          fi

          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$CLAUDE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing_pr" ]; then
            echo "Pull request #$existing_pr already exists for $CLAUDE_BRANCH."
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$DEFAULT_BRANCH" \
            --head "$CLAUDE_BRANCH" \
            --title "$ISSUE_TITLE" \
            --body "Implementação automática da issue #$ISSUE_NUMBER. Closes #$ISSUE_NUMBER"
